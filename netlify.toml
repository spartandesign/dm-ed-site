# Netlify configuration for a plain static site.
# No build step: the HTML at the repository root is published as-is.
[build]
  publish = "."
  command = ""

# Long-cache the static assets (fonts/CSS/JS rarely change).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# A few sensible security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
